<!DOCTYPE html>
<html>
<head>
    <title>Study Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h1>Generate Study Plan</h1>
<form action="/generate_ai_plan" method="POST">

    <input type="text"
           name="subject"
           placeholder="Subject"
           required>

    <input type="date"
           name="exam_date"
           required>

    <input type="number"
           name="hours"
           placeholder="Hours Per Day"
           required>

    <select name="difficulty">
        <option>Easy</option>
        <option>Medium</option>
        <option>Hard</option>
    </select>

    <button type="submit">
        Generate AI Plan
    </button>

</form>

</body>
</html>
